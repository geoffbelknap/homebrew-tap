name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Check tap formulae load
        run: brew readall --aliases --os=all --arch=all geoffbelknap/tap

      - name: Determine changed formulae
        id: changed
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const formulae = files
              .map(f => f.filename)
              .filter(name => /^[A-Za-z0-9_-]+\.rb$/.test(name))
              .map(name => name.replace(/\.rb$/, ''))
              .filter((value, index, self) => self.indexOf(value) === index)
              .join(',');
            core.setOutput('formulae', formulae);
            if (formulae) {
              core.info(`Changed formulae: ${formulae}`);
            } else {
              core.info('No formula changes detected; skipping per-formula test-bot run.');
            }
            return formulae;

      - name: Build bottles for changed formulae
        if: github.event_name == 'pull_request' && steps.changed.outputs.formulae != ''
        env:
          CHANGED_FORMULAE: ${{ steps.changed.outputs.formulae }}
        run: brew test-bot --only-formulae --testing-formulae="$CHANGED_FORMULAE"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.formulae != ''
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
